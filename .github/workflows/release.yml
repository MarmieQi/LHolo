name: Build and publish release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and attach the package to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.event.release.tag_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify original build artifact, attach package and verify uploaded digest
        run: >-
          python tools/oreui/publish_release.py
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          --run-id "$GITHUB_RUN_ID" --artifact-id "$RELEASE_ARTIFACT"
